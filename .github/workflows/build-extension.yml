name: Build Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extension version: $VERSION"

      - name: Type check
        run: npm run compile

      - name: Build and zip (Chrome & Edge)
        run: |
          npm run zip
          npm run zip:edge
          ls -lh .output/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabgo-extension
          path: .output/*.zip
          include-hidden-files: true
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: .output/*.zip
          body: |
            ## TabGo v${{ steps.version.outputs.version }}

            ### ⚠️ 重要提示

            **请下载下方的 `tabgo-${{ steps.version.outputs.version }}-chrome.zip`（Chrome）或 `-edge.zip`（Edge）文件！**

            ❌ **不要下载** "Source code (zip)" 或 "Source code (tar.gz)"，这些是完整的源代码仓库，包含开发文件，不能直接使用！

            ✅ **正确的文件**：`tabgo-${{ steps.version.outputs.version }}-chrome.zip` / `tabgo-${{ steps.version.outputs.version }}-edge.zip`

            ---

            ### 📦 安装方法
            1. 下载与浏览器对应的 zip 文件
            2. 解压到本地目录
            3. 打开 `chrome://extensions/` 或 `edge://extensions/`
            4. 开启右上角的"开发者模式"
            5. 点击"加载已解压的扩展程序"
            6. 选择解压后的目录

            ### ✨ 功能特性
            - 🔄 自动标签页分组
            - 📋 白名单管理
            - 🏷️ 分组别名管理
            - 🌐 子域名分组
            - 🎵 手风琴模式

            ---
            🤖 此版本由 GitHub Actions 自动构建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
